name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and package
        id: package
        run: ./tools/Build-HostedRelease.ps1
      - name: Save release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-release
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-release
          path: dist/release
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          notes="docs/releases/$RELEASE_TAG.md"
          test -f "$notes"
          (cd dist/release && sha256sum --check SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" \
            "dist/release/SegotepDM-$RELEASE_TAG-windows-x64.zip" \
            dist/release/SHA256SUMS.txt \
            --verify-tag --latest \
            --title "SegotepDM $RELEASE_TAG" --notes-file "$notes"
